<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a16">
  <title>Recuperando o Norteia</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#071a16;color:#f5fffb;font:16px/1.5 system-ui,sans-serif}.card{width:min(440px,100%);padding:28px;border:1px solid #2c5a4d;border-radius:24px;background:#0d2a23;box-shadow:0 24px 70px #0008}h1{margin:0 0 8px;font-size:25px}p{margin:0;color:#c9ddd6}.dot{width:36px;height:36px;margin-bottom:18px;border:4px solid #4bc6a5;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}a{display:none;margin-top:18px;color:#8ff0d0;font-weight:700}
  </style>
</head>
<body>
  <main class="card"><div class="dot" aria-hidden="true"></div><h1>Recuperando o Norteia</h1><p id="status">Limpando a atualização anterior com segurança…</p><a id="continue" href="./?recovered=1">Abrir o Norteia</a></main>
  <script>
  (async function(){
    var status=document.getElementById('status'),link=document.getElementById('continue');
    try{
      if('serviceWorker' in navigator){var registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(function(registration){return registration.unregister()}))}
      if('caches' in window){var keys=await caches.keys();await Promise.all(keys.map(function(key){return caches.delete(key)}))}
      status.textContent='Recuperação concluída. Abrindo o app…';
      setTimeout(function(){location.replace('./?recovered='+Date.now())},400);
    }catch(error){status.textContent='A limpeza automática terminou parcialmente. Toque abaixo para continuar.';link.style.display='inline-block'}
  })();
  </script>
</body>
</html>
