<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teste Comunidade Norteia</title>
<link rel="stylesheet" href="../community.css">
<link rel="stylesheet" href="../norteia-v2.css">
<style>
body{margin:0;background:#f7faf8;color:#14231d;font-family:Inter,system-ui,sans-serif}.hidden{display:none!important}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{padding:16px}.desktop-nav{display:grid;gap:8px}.main{min-width:0}.top{display:flex;align-items:center;padding:12px 20px}.content{padding:20px}.section{display:none}.section.active{display:block}.mobile-nav{display:none}.btn{min-height:40px}
@media(max-width:820px){.app{display:block}.desktop-nav{display:none}.content{padding:0 12px 90px}.top{display:none}.mobile-nav{display:grid;position:fixed;z-index:80;left:8px;right:8px;bottom:8px;grid-template-columns:repeat(5,1fr);padding:6px;background:#fff;border:1px solid #dce6e1;border-radius:18px}.mobile-nav button{height:48px;border:0;background:transparent}.sidebar{padding:0}}
</style>
<script>
(function(){
 const user={id:'11111111-1111-4111-8111-111111111111',email:'ana@norteia.local',user_metadata:{full_name:'Ana Silva'}};
 const profile={user_id:user.id,display_name:'Ana Silva',username:'ana.silva',avatar_url:'',bio:'Organizando minha vida financeira.',status:'active',is_admin:false,specialist_verified:false,created_at:'2026-07-20T12:00:00Z'};
 const posts=[{id:'post-1',author_id:user.id,category_slug:'Organização financeira',text:'Comecei a organizar meus gastos por categoria e já consigo enxergar melhor o mês.',image_url:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1400"><defs><linearGradient id="g" x2="0" y2="1"><stop stop-color="#38c5a2"/><stop offset="1" stop-color="#0c3b30"/></linearGradient></defs><rect width="800" height="1400" fill="url(#g)"/><circle cx="400" cy="520" r="220" fill="#fff" opacity=".14"/><text x="400" y="700" text-anchor="middle" font-family="sans-serif" font-size="68" fill="white">Minha jornada</text></svg>'),created_at:new Date(Date.now()-7200000).toISOString(),like_count:4,comment_count:2,save_count:1,repost_count:0,community_profiles:profile}];
 function result(table,method){
  if(table==='community_profiles')return method==='list'?{data:[profile],error:null}:{data:profile,error:null};
  if(table==='community_categories')return{data:['Aprendi','Dúvida','Organização financeira','Dívidas','Renda fixa','Ações','Fundos imobiliários','ETFs','Criptomoedas','Economia','Imposto de renda','Meta','Conquista','Opinião','Notícia'].map((label,i)=>({label,sort_order:i})),error:null};
  if(table==='community_posts')return method==='single'?{data:posts[0],error:null}:{data:posts,error:null};
  if(table==='community_user_interests')return{data:[{interest_slug:'organizar-minhas-financas'}],error:null};
  if(table==='community_post_likes'||table==='community_saved_posts'||table==='community_follows'||table==='community_notifications')return{data:[],error:null,count:0};
  return{data:[],error:null,count:0};
 }
 function query(table){let method='list';const q={};['select','eq','is','order','limit','lt','in','or','ilike','match','not','update','insert','upsert','delete'].forEach(k=>q[k]=function(){if(k==='insert')method='single';return q});q.single=async()=>result(table,'single');q.maybeSingle=async()=>result(table,'single');q.then=(ok,fail)=>Promise.resolve(result(table,method)).then(ok,fail);return q}
 window.cockpitUser=user;window.cockpitSupabase={from:query,channel:()=>({on(){return this},subscribe(){return this}}),removeChannel(){},storage:{from:()=>({upload:async()=>({data:null,error:null}),getPublicUrl:()=>({data:{publicUrl:''}}),remove:async()=>({error:null})})}};
})();
</script>
</head>
<body class="app-mode">
<div class="app" id="appView">
 <aside class="sidebar" id="nav">
  <div class="desktop-nav"><button class="active" data-view="dashboard">Início</button></div>
  <div class="mobile-nav"><button data-view="dashboard">Início</button><button data-view="register">Movimentações</button><button data-view="analysis">Análise</button><button data-view="wallet">Patrimônio</button><button data-view="more">Mais</button></div>
 </aside>
 <main class="main"><header class="top"><div class="title"><h1 id="pageTitle">Início</h1><p id="monthHint">Sua visão financeira.</p></div></header><div class="content"><section class="section active" id="dashboard">Início</section></div></main>
 <button id="globalAddBtn" aria-label="Adicionar">+</button>
</div>
<script>
document.getElementById('nav').addEventListener('click',function(event){const button=event.target.closest('[data-view]');if(!button)return;document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));const section=document.getElementById(button.dataset.view);if(section)section.classList.add('active')});
</script>
<script src="../community.js"></script>
<script src="../community-mobile.js"></script>
</body>
</html>
